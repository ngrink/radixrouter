name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum declared in engines, 24 the current release; both .ts
        # execution and the test runner's behaviour change in between, so all three
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      # Types are checked once: they do not depend on the Node version
      - run: npm run typecheck
        if: matrix.node == '24'
